# Controlled vocabulary of liability codes.
#
# This file is the single source of truth. The schema, the ground-truth files and
# run_eval.py all read codes from here, so a code only has to be added once.
#
# Each entry:
#   code:      snake_case identifier used in dossier.json and ground truth
#   label:     short human-readable name for the memo tables
#   mandatory: true if the liability must appear in every dossier's `liabilities`
#              list, even with status no_evidence_found or not_assessed
#   notes:     scope of the code, so two reviewers classify the same finding alike
#
# TODO (owner): extend this vocabulary to the liability domains you want covered.
# The five mandatory entries below are the ICH S7A core safety-pharmacology domains
# plus genotoxicity, which SKILL.md Step 5 requires in every dossier. Everything
# else a dossier might flag needs a code here, or it falls back to `other`.

version: 0.1.0

liabilities:
  - code: cv_qt_proarrhythmia
    label: QT prolongation / proarrhythmia
    mandatory: true
    notes: >-
      Cardiac ion-channel effects and their electrophysiological consequences.
      TODO (owner): confirm scope, and whether non-hERG channels get their own code.

  - code: cv_hemodynamic
    label: Hemodynamic effects
    mandatory: true
    notes: >-
      Blood-pressure and heart-rate effects.
      TODO (owner): confirm scope.

  - code: cns_neurotoxicity
    label: CNS / neurotoxicity
    mandatory: true
    notes: >-
      Central and peripheral nervous system effects.
      TODO (owner): confirm scope, and whether peripheral neuropathy is separate.

  - code: respiratory
    label: Respiratory
    mandatory: true
    notes: >-
      Respiratory function and lung findings.
      TODO (owner): confirm scope.

  - code: genotoxicity
    label: Genotoxicity
    mandatory: true
    notes: >-
      Mutagenicity, clastogenicity, aneugenicity.
      TODO (owner): confirm scope, and whether carcinogenicity is separate.

  # ---- stubs -------------------------------------------------------------------
  #
  # Added so the harness stops refusing cases whose ground truth references them.
  # The identifiers are settled; the SCOPE IS NOT. Each `notes` field is a TODO,
  # and a code with unsettled scope will still score inconsistently, because two
  # reviewers will classify the same finding differently. Write the scope before
  # you mark any case verified.

  - code: hepatic
    label: Hepatic
    mandatory: false
    notes: >-
      TODO (owner): define scope. Decide at least whether this covers enzyme
      elevations and overt injury under one code or needs splitting, and where
      cholestatic findings sit.

  - code: ocular
    label: Ocular
    mandatory: false
    notes: >-
      TODO (owner): define scope. Decide whether reversible visual disturbance and
      structural eye findings share this code.

  - code: dermal_phototoxicity
    label: Dermal / phototoxicity
    mandatory: false
    notes: >-
      TODO (owner): define scope. Decide whether light-dependent reactions and
      light-independent skin findings belong under one code; they have different
      mechanisms and different NAMs, which argues for splitting them.

  # ---- fallback ----------------------------------------------------------------

  - code: other
    label: Other
    mandatory: false
    notes: >-
      Fallback only. A dossier using this code must describe the liability in
      `mechanism_hypothesis`. Recurring uses of `other` mean this vocabulary is
      missing a code.

# TODO (owner): add the remaining organ-system and mechanism codes you want to
# score against. Suggested domains to consider, left for you to define and scope:
# renal, hematologic, immune, reproductive/developmental, carcinogenicity,
# gastrointestinal, musculoskeletal, endocrine/metabolic, drug-interaction
# liability, cardiac contractility, valvulopathy, thrombosis/bleeding.
#
# Two open scope questions that the p02_amiodarone_af draft ran into, and that
# change what a correct answer is:
#   - Does `cv_qt_proarrhythmia` cover arrhythmia exacerbation generally, or only
#     QT-interval effects? If the latter, a separate arrhythmia code is needed.
#   - Does peripheral neuropathy sit under `cns_neurotoxicity`, despite not being
#     central, or get its own code?

