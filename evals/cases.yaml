# Eval cases for nonclinical-safety-nam-dossier.
#
# Each case is one prompt given to the skill. Ground truth lives in
# ground_truth/<case_id>.yaml and is verified by the repo owner against the current
# FDA label, not by Claude.
#
# TODO (owner): confirm or replace every compound below.
#
# These are suggestions only, chosen because each is a long-approved small molecule
# whose label is public and stable, so ground truth is checkable. Nothing is asserted
# here about what any of them causes — that is exactly what you verify from the label.
# Swap in compounds closer to your customers' chemistry if that demos better.
#
# Selection criteria worth preserving if you change the list:
#   - approved, so there is a label to verify against
#   - small molecule, since the skill declares biologics out of scope
#   - a mix of liability domains, so recall isn't measured on one organ system
#   - a mix of mechanism bases: on-target, off-target, and class
#   - present in ChEMBL and PubChem, so Step 1 can resolve identity
#
# case_kind:
#   positive          - expected to surface documented liabilities; scores recall
#   negative_control  - expected NOT to surface particular liabilities; scores false
#                       alarms. A negative control is not a "safe drug"; it is a
#                       compound whose label does not carry the liabilities listed in
#                       its ground truth's absent_liabilities.
#   target_only       - no compound given; exercises the target-level path
#   out_of_scope      - the skill should decline; exercises the scope guard

version: 0.1.0

defaults:
  runs_per_case: 3
  expect_outputs: [memo.md, dossier.json]

cases:

  # ---- positives -------------------------------------------------------------

  - case_id: p01_thalidomide_mm
    case_kind: positive
    compound: thalidomide
    indication: multiple myeloma
    prompt: >-
      Produce a NAM-first nonclinical safety assessment for thalidomide in multiple
      myeloma.
    rationale: >-
      TODO (owner): confirm. Chosen as a case where the best-documented liability is
      developmental and where species differences are part of the historical record,
      so the memo's limitations section gets exercised.
    notes: TODO (owner) — verify against current label before enabling.

