    notes: TODO (owner) — withdrawn; decide the ground-truth source before enabling.

  # TODO (owner): consider adding two more positives covering liability domains the
  # four above miss. Pick from the domains you defined in liability_taxonomy.yaml
  # once that vocabulary is filled in, so recall is measured across the taxonomy
  # rather than across whatever these four happen to cover.

  # ---- negative controls -----------------------------------------------------
  #
  # For each of these, ground_truth lists absent_liabilities: the liability codes the
  # label does NOT carry. A run that flags one of those as `signal` is a false alarm.
  # Flags that are neither expected nor listed absent are reported for human review
  # and not scored, since the eval cannot tell a hallucination from a real find the
  # ground truth simply doesn't cover.

  - case_id: n01_metformin_t2d
    case_kind: negative_control
    compound: metformin
    indication: type 2 diabetes
    prompt: >-
      Produce a NAM-first nonclinical safety assessment for metformin in type 2
      diabetes.
    rationale: >-
      TODO (owner): confirm, and decide which liability codes to list as absent.
      Chosen as a long-marketed compound with an extensive label, which makes it a
      test of precision rather than of silence.
    notes: TODO (owner) — populate absent_liabilities from the label.

