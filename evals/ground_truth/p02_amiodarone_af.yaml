# Ground-truth template. Copy to <case_id>.yaml and fill in.
#
# VERIFIED BY A PERSON, NOT BY CLAUDE. Every field below is a judgement about what a
# current drug label says. Fill it in by reading the label — DailyMed, or the FDA
# label for the specific application — and record which version you read, so a future
# reader can tell whether the ground truth has gone stale.
#
# While `verified: false`, run_eval.py reports the case but skips recall and
# false-alarm scoring for it. That is intentional: scoring against an unverified
# answer key produces a number that looks like a result and isn't one. Citation
# validity and consistency are still scored, since those need no ground truth.

case_id: p02_amiodarone_af
verified: false

# ---- provenance of this answer key ----------------------------------------------

source:
  label_source: DailyMed (amiodarone hydrochloride tablets, one ANDA generic label)
  label_url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c536e0ad-2758-4022-8242-f5e9b6aca1e2
  label_version_or_date: "Revised 8/2023 (as shown on the DailyMed page; confirm against the page you read)"
  retrieved: 2026-11-25
  verified_by: TODO           # leave TODO until a person has read the full label and checked every entry below
  notes: >-
    DRAFT prepared by Claude from search excerpts of this label and several other
    amiodarone labels. NOT verified. Generic labels differ in revision date and
    possibly in section numbering (W&P numbers below came from different label
    versions), so re-check each locator against the single label you read. Keep
    `verified: false` until then.

# ---- expected liabilities (scores recall) ---------------------------------------
#
# Liabilities the label documents, that a good dossier should surface with
# status `signal`. Codes come from
# skills/nonclinical-safety-nam-dossier/references/liability_taxonomy.yaml.
#
# `weight` lets you distinguish a boxed warning from a minor mention. Recall is
# reported both unweighted and weighted, so you can leave every weight at 1.0 and
# ignore the weighted figure if you prefer.
#
# `label_section` and `label_quote_or_locator` are what make this checkable later.
# Prefer a short locator over a long quote.

expected_liabilities:
  # DRAFT, unverified. Boxed-warning items weighted 1.0, W&P-only items 0.5.
  # mechanism_basis is `unknown` throughout: the label does not state it, and
  # assigning one is a judgement for the verifier.
  - code: respiratory
    weight: 1.0
    label_section: Boxed Warning; Warnings and Precautions 5.2 (Pulmonary Toxicity)
    label_quote_or_locator: "Boxed warning: pulmonary toxicity (hypersensitivity or interstitial/alveolar pneumonitis)"
    mechanism_basis: unknown
    note: Label also notes fatal cases; do not score severity.
  - code: hepatic            # stub code: scope not yet written in the taxonomy
    weight: 1.0
    label_section: Boxed Warning; Warnings and Precautions 5.3 (Hepatic Injury)
    label_quote_or_locator: "Boxed warning: hepatic toxicity; W&P 5.3 hepatic injury, transaminase monitoring"
    mechanism_basis: unknown
    note: Taxonomy has a hepatic stub; its scope still needs defining.
  - code: cv_qt_proarrhythmia
    weight: 1.0
    label_section: Boxed Warning; Warnings and Precautions 5.4 (Worsened Arrhythmia)
    label_quote_or_locator: "Boxed warning: can exacerbate arrhythmias; W&P 5.4 worsened arrhythmia"
    mechanism_basis: unknown
    note: >-
      Mapping "worsened arrhythmia" to cv_qt_proarrhythmia is a scope judgement under
      the current taxonomy notes. Confirm, or split out a separate arrhythmia code.
  - code: ocular               # stub code: scope not yet written
    weight: 0.5
    label_section: Warnings and Precautions 5.5 (Visual Impairment)
    label_quote_or_locator: "W&P 5.5 visual impairment and loss of vision"
    mechanism_basis: unknown
    note: Section number seen in one label version only; confirm.
  - code: cns_neurotoxicity
    weight: 0.5
    label_section: Warnings and Precautions (Neurologic Toxicity / neuropathy; section number varies by label version)
    label_quote_or_locator: "Adverse reactions list neuropathy; W&P cross-reference to neuropathy"
    mechanism_basis: unknown
    note: Depends on whether the taxonomy keeps peripheral neuropathy under cns_neurotoxicity.
  - code: dermal_phototoxicity # stub code: scope not yet written
    weight: 0.5
    label_section: Warnings and Precautions (Photosensitivity and Skin Discoloration)
    label_quote_or_locator: "W&P photosensitivity and skin discoloration"
    mechanism_basis: unknown
    note: Section number seen in one label version only; confirm.
  # - code: TODO
  #   weight: 1.0
  #   label_section: TODO       # e.g. Boxed Warning, Warnings and Precautions, Nonclinical Toxicology
  #   label_quote_or_locator: TODO
  #   mechanism_basis: TODO     # on_target | off_target | class | chemistry | unknown
  #   note: TODO

# ---- absent liabilities (scores false alarms) -----------------------------------
#
# Liability codes the label does NOT carry, which a dossier therefore should not
# report as `signal`.
#
# Be careful here, and be conservative. Listing a code as absent asserts something
# about the label. An absence you are not sure about belongs in `unscored_notes`
# instead, not here — a wrong entry turns a correct find into a scored false alarm.
# `no_evidence_found` on one of these codes is the correct outcome, not a miss.

absent_liabilities: []
  # - code: TODO
  #   basis: TODO              # why you are confident the label does not carry it
  #   note: TODO

# ---- scope guard ----------------------------------------------------------------
#
# For out_of_scope cases only: the skill should decline rather than produce a
# degraded dossier. Scored pass/fail on the decline.

expect_decline: false
decline_reason_expected: null   # e.g. "not a small molecule"

# ---- expected identity resolution -----------------------------------------------
#
# Optional. Lets the harness check Step 1 independently of liability scoring. Leave
# a field null if you don't want it checked.

expected_identity:
  pubchem_cid: null
  chembl_id: null
  inchikey: null
  primary_targets: []          # gene symbols
  ambiguity_expected: null     # true if the input legitimately resolves to more than one entity

# ---- things the eval must not score ---------------------------------------------
#
# Anything you know but can't turn into a clean scored expectation. The harness
# prints these next to the case's results as context for a human reader, and does
# not score them.
#
# Use this for: liabilities that are real but not label-documented; domains where the
# label is ambiguous; findings that are species-specific; anything where a reasonable
# dossier could go either way.

unscored_notes:
  - "Label versions I excerpted also appear to mention thyroid abnormalities. I did not confirm the section; add as an expected liability only after reading the label."
  - "absent_liabilities is intentionally left empty. I have not read the Nonclinical Toxicology section, so I will not assert any absence (e.g. genotoxicity). Decide this yourself after reading it."
  - "expected_identity is left null. PubChem/ChEMBL IDs and primary targets should be taken from the connectors or the databases, not from memory."
